name: Signed desktop release
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release-id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate tag and application versions
        id: version
        run: bun scripts/release-version.ts
      - name: Prepare unpublished release
        id: release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const prerelease = process.env.PRERELEASE === 'true';
            const repo = context.repo;
            // The by-tag endpoint only resolves published releases.
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing) {
              if (!existing.draft || existing.prerelease !== prerelease) throw new Error('Release is already published or its channel differs');
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              ...repo, tag_name: tag, name: `LingoSofa ${tag}`, draft: true,
              prerelease, generate_release_notes: true,
              body: 'Windows x64 and macOS Apple Silicon / Intel builds. Updater artifacts are signed. Windows code signing and macOS Developer ID signing / notarization are not yet configured; OS security prompts may appear. See docs/installation.md and docs/acceptance.md for requirements and acceptance limits.'
            });
            return data.id;
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
          cache-bin: false
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.149
      - run: bun install --frozen-lockfile
      - run: npm run check
      - name: Build and upload signed artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: node ../../node_modules/@tauri-apps/cli/tauri.js
          args: --config src-tauri/tauri.release.conf.json
          releaseId: ${{ needs.prepare.outputs.release-id }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          releaseAssetNamePattern: LingoSofa_[version]_[platform]_[arch][ext]
          # A single publisher assembles the manifest after every platform succeeds.
          uploadUpdaterJson: false
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ matrix.os }}
          path: |
            .cache/runtime-tests/*.json
            .cache/runtime-tests/*.junit.xml
            target/cargo-timings/*.html
          include-hidden-files: true
          if-no-files-found: ignore
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify all artifacts, create updater manifest and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: bun scripts/publish-release.ts
