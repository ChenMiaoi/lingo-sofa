name: Signed desktop release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  release:
    strategy:
      fail-fast: false
      # Serialize latest.json updates so all platforms remain in the manifest.
      max-parallel: 1
      matrix:
        os: [windows-2025, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
          cache-bin: false
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.149
      - run: bun install --frozen-lockfile
      - name: Verify release version
        run: bun scripts/release-version.ts
      - run: npm run check
      - name: Build signed updater artifacts and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: node ../../node_modules/@tauri-apps/cli/tauri.js
          args: --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: LingoSofa v__VERSION__
          releaseDraft: true
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
