name: Windows packaging profile

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Source revision to measure (empty uses the workflow revision)
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Measure Windows packaging and installation
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: false
      - run: npm ci
      - run: npm run build --workspace @lingo-sofa/pi-bridge
      - run: npm run package:native --workspace @lingo-sofa/pi-bridge
      - run: npm test -- tests/bridge.test.ts tests/assistant-installer.test.ts
      - run: npm run package:assistant --workspace @lingo-sofa/pi-bridge
      - run: npm run verify:assistant
      - name: Prepare local diagnostic inputs from this revision
        shell: pwsh
        run: |
          $profileVersion = (Get-Content apps/pi-bridge/package.json | ConvertFrom-Json).version
          $profileName = "lingo-sofa-assistant-$profileVersion-win32-x64"
          $profileInput = ".cache/windows-profile/input"
          New-Item -ItemType Directory -Path $profileInput -Force | Out-Null
          Copy-Item "apps/pi-bridge/dist/installers/$profileName.tar.gz" $profileInput
          Copy-Item "apps/pi-bridge/dist/installers/$profileName.json" "$profileInput/assistant-release.json"
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md $profileInput
          Copy-Item docs/installation.md "$profileInput/INSTALLATION.md"
          git archive --format=tar.gz --output="$profileInput/lingo-sofa-source-$profileVersion.tar.gz" HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source archive failed" }
      - name: Build and verify combined installer without publishing
        run: npm run package:windows -- .cache/windows-profile/input .cache/windows-profile/output
