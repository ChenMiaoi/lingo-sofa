[package]
name = "lingo-sofa-selection-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
lingo-sofa-core = {path="../core"}
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = {version="0.62.2",features=["Win32_UI_Accessibility","Win32_System_Com","Win32_System_Ole","Win32_UI_HiDpi","Win32_UI_WindowsAndMessaging"]}

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
