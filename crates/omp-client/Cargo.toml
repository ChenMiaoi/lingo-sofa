[package]
name = "lingo-sofa-omp-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
test-keychain = []

[dependencies]
lingo-sofa-core = { path = "../core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
ring = "0.17"
