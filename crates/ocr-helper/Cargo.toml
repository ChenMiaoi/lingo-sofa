[package]
name = "lingo-sofa-ocr-helper"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSData", "NSDictionary", "NSError", "NSString", "NSObject", "NSProcessInfo"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation"] }

[dev-dependencies]
tempfile = "3"
