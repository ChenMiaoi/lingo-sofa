[package]
name = "lingo-sofa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = {version="2",features= [] }
[dependencies]
tauri = {version="2",features= ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
lingo-sofa-app-services = {path="../../../crates/app-services"}
serde.workspace = true

lingo-sofa-core = {path="../../../crates/core"}
lingo-sofa-omp-client = {path="../../../crates/omp-client"}
serde_json.workspace = true
rusqlite = {version="0.37",features= ["bundled"] }
[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = {version="0.62.2",features= ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
