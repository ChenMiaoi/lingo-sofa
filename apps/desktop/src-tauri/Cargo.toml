[package]
name = "lingo-sofa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = {version="2",features= [] }
[dependencies]
tauri = {version="2",features= ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
lingo-sofa-app-services = {path="../../../crates/app-services"}
serde.workspace = true

lingo-sofa-core = {path="../../../crates/core"}
lingo-sofa-omp-client = {path="../../../crates/omp-client"}
serde_json.workspace = true
rusqlite = {version="0.37",features= ["bundled"] }
tauri-plugin-updater = "~2.14.0"
reqwest = {version="0.13",default-features=false,features= ["json", "rustls-no-provider"] }
rustls = {version="0.23",default-features=false,features= ["ring"] }
tokio = {version="1",features= ["time"] }
[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = {version="0.62.2",features= ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
