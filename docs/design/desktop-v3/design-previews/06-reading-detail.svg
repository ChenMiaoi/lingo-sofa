<linearGradient id="wall" x2="1" y2="1"><stop stop-color="#e9ede3"/><stop offset="1" stop-color="#dce8d9"/></linearGradient></defs><g font-family="Inter,Segoe UI,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="900" height="640" rx="0" fill="#f5f6ef" /><text x="50" y="51" font-size="15" fill="#536e55" font-weight="500" >LingoSofa / 普通翻译模式</text><rect x="50" y="78" width="800" height="487" rx="7" fill="#fffefa" stroke="#e1e8da"/><text x="89" y="115" font-size="10" fill="#8b9e7e" font-weight="400" >Margin · Design notes</text><path d="M89 131L810 131" stroke="#e4eadf" stroke-width="1" fill="none"/><text x="89" y="173" font-size="24" fill="#3d5240" font-weight="400" font-family="Georgia,serif">Making room for what matters.</text><rect x="89" y="207" width="318" height="20" rx="0" fill="#e0ecdf" /><rect x="89" y="231" width="373" height="20" rx="0" fill="#e0ecdf" /><rect x="89" y="255" width="296" height="20" rx="0" fill="#e0ecdf" /><text x="89" y="222" font-size="14" fill="#3e5144" font-weight="400" >Good design is as little design as possible.</text><text x="89" y="246" font-size="14" fill="#3e5144" font-weight="400" >It helps us focus on what matters, without getting</text><text x="89" y="270" font-size="14" fill="#3e5144" font-weight="400" >in the way of what we're trying to do.</text><g transform="translate(89 289)"><g class="translation-overlay"><rect x="0" y="0" width="476" height="105" rx="3" fill="#fcfdf9" /><path d="M0 12L0 93" stroke="#9fcdb2" stroke-width="2" fill="none"/><text x="16" y="29" font-size="15" fill="#354c3e" font-weight="400" >好的设计，是尽可能少的设计。</text><text x="16" y="55" font-size="15" fill="#354c3e" font-weight="400" >它帮助我们专注于真正重要的事，</text><text x="16" y="81" font-size="15" fill="#354c3e" font-weight="400" >而不打扰我们正在做的事。</text><g class="translation-actions" style="opacity:1"><rect x="282" y="99" width="194" height="30" rx="5" fill="#fbfdf9" stroke="#dce8de"/><svg x="293" y="108" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#607e6a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#copy"/></svg><text x="313" y="119" font-size="10" fill="#5f7d69" font-weight="400" >复制</text><path d="M345 108L345 122" stroke="#dfe8df" stroke-width="1" fill="none"/><svg x="357" y="108" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#607e6a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#search"/></svg><text x="377" y="119" font-size="10" fill="#5f7d69" font-weight="400" >Ask</text><path d="M405 108L405 122" stroke="#dfe8df" stroke-width="1" fill="none"/><svg x="417" y="108" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#607e6a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#close"/></svg><text x="437" y="119" font-size="10" fill="#5f7d69" font-weight="400" >收起</text></g></g></g><text x="89" y="484" font-size="16" fill="#72856a" font-weight="400" font-family="Georgia,serif">Less friction. More flow.</text><text x="89" y="513" font-size="11" fill="#9caa92" font-weight="400" >When technology meets us where we are, curiosity becomes understanding.</text><text x="450" y="600" font-size="11" fill="#778f70" font-weight="400" text-anchor="middle">贴在选区下方的临时浮层 · 不打开 Ask · 不改变原文布局</text></g></svg>