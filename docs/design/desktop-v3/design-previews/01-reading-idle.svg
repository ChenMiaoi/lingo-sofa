x="543" y="198" font-size="12" fill="#778c70" font-weight="400" >转入 Ask</text><rect x="654" y="176" width="145" height="35" rx="6" fill="none" /><text x="668" y="198" font-size="9" fill="#8ca084" font-weight="400" >05</text><text x="693" y="198" font-size="12" fill="#778c70" font-weight="400" >空间不足时</text><text x="1546" y="198" font-size="10" fill="#8b9d84" font-weight="400" text-anchor="end">概念预览 · 非浏览器截图</text><rect x="54" y="225" width="1492" height="728" rx="15" fill="#e7ece1" stroke="#d9e3d1"/><rect x="62" y="233" width="1476" height="712" rx="9" fill="url(#wall)" /><g transform="translate(62 233)"><text x="25" y="29" font-size="9" fill="#8b9e82" font-weight="400" letter-spacing="1.4">YOUR WORKSPACE</text><text x="1451" y="29" font-size="9" fill="#8b9e82" font-weight="400" text-anchor="end" letter-spacing="1">NORMAL MODE</text><g transform="translate(170 60)"><rect x="0" y="0" width="960" height="594" rx="8" fill="#fffefa" stroke="#f5f8ef"/><rect x="0" y="0" width="960" height="34" rx="8" fill="#f1f3ec" /><rect x="0" y="26" width="960" height="8" rx="0" fill="#f1f3ec" /><text x="17" y="23" font-size="14" fill="#4b6052" font-weight="600" font-family="Georgia,serif">M</text><text x="39" y="23" font-size="10" fill="#758774" font-weight="400" >Margin · Design notes</text><svg x="861" y="12" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8a9c88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#minus"/></svg><svg x="895" y="12" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8a9c88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#square"/></svg><svg x="928" y="12" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8a9c88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#close"/></svg><path d="M0 34L960 34" stroke="#dfe5dc" stroke-width="1" fill="none"/><rect x="0" y="34" width="148" height="560" rx="0" fill="#f6f7f0" /><path d="M148 34L148 594" stroke="#e8ede2" stroke-width="1" fill="none"/><text x="20" y="70" font-size="8" fill="#8b9c86" font-weight="400" letter-spacing="1.3">WORKSPACE</text><svg x="20" y="81" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8aa082" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#grid"/></svg><text x="41" y="92" font-size="9" fill="#7b9071" font-weight="400" >Overview</text><svg x="20" y="110" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8aa082" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#document"/></svg><text x="41" y="121" font-size="9" fill="#7b9071" font-weight="400" >Reading</text><rect x="10" y="137" width="128" height="28" rx="4" fill="#e8efe1" /><svg x="20" y="139" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8aa082" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#document"/></svg><text x="41" y="150" font-size="9" fill="#7b9071" font-weight="400" >Design notes</text><svg x="20" y="168" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8aa082" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#bookmark"/></svg><text x="41" y="179" font-size="9" fill="#7b9071" font-weight="400" >Saved</text><path d="M20 222L128 222" stroke="#e3ebdb" stroke-width="1" fill="none"/><text x="20" y="246" font-size="8" fill="#91a087" font-weight="400" letter-spacing="1.1">COLLECTIONS</text><text x="20" y="273" font-size="9" fill="#91a087" font-weight="400" >Small ideas</text><text x="20" y="300" font-size="9" fill="#91a087" font-weight="400" >For later</text><text x="198" y="71" font-size="8" fill="#83967d" font-weight="400" letter-spacing="1.5">READING / DESIGN NOTES</text><text x="198" y="116" font-size="28" fill="#314338" font-weight="400" font-family="Georgia,serif">Making room for what matters.</text><text x="198" y="143" font-size="9" fill="#91a087" font-weight="400" >Emma Wilson   ·   6 min read   ·   October 20</text><text x="198" y="190" font-size="13" fill="#6f806e" font-weight="400" >The best tools don't ask for your attention.</text><text x="198" y="213" font-size="13" fill="#6f806e" font-weight="400" >They give it back.</text><text x="198" y="258" font-size="14" fill="#3e5144" font-weight="400" >Good design is as little design as possible.</text><text x="198" y="282" font-size="14" fill="#3e5144" font-weight="400" >It helps us focus on what matters, without getting</text><text x="198" y="306" font-size="14" fill="#3e5144" font-weight="400" >in the way of what we're trying to do.</text><text x="198" y="493" font-size="18" fill="#566b56" font-weight="400" font-family="Georgia,serif">Less friction. More flow.</text><text x="198" y="523" font-size="12" fill="#7f9178" font-weight="400" >When technology meets us where we are, small moments of curiosity</text><text x="198" y="545" font-size="12" fill="#7f9178" font-weight="400" >become opportunities to understand. We stay focused on the work</text><text x="198" y="567" font-size="12" fill="#7f9178" font-weight="400" >in front of us, rather than the tools around it.</text></g><rect x="0" y="669" width="1476" height="43" rx="0" fill="#f7f9ef99" /><path d="M0 669L1476 669" stroke="#ffffff77" stroke-width="1" fill="none"/><rect x="640" y="683" width="6" height="6" rx="0" fill="#95ab8d" /><rect x="648" y="683" width="6" height="6" rx="0" fill="#95ab8d" /><rect x="640" y="691" width="6" height="6" rx="0" fill="#95ab8d" /><rect x="648" y="691" width="6" height="6" rx="0" fill="#95ab8d" /><svg x="685" y="682" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#92a589" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#document"/></svg><svg x="728" y="679" width="25" height="25" viewBox="0 0 32 32" fill="none" stroke="#76976e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#sofa"/></svg><text x="1457" y="685" font-size="8" fill="#93a487" font-weight="400" text-anchor="end">10:24</text><text x="1457" y="699" font-size="8" fill="#93a487" font-weight="400" text-anchor="end">2026/10/20</text><rect x="1403" y="333" width="34" height="34" rx="10" fill="#e2f0dc" stroke="#f5fbea"/><svg x="1408" y="338" width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="#83a079" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#sofa"/></svg></g><text x="56" y="987" font-size="12" fill="#3d5e42" font-weight="500" >普通状态，只留下一个很小的入口。</text><text x="56" y="1011" font-size="10" fill="#7c9375" font-weight="400" >没有常驻启动器，没有默认回答区。</text><text x="1546" y="987" font-size="10" fill="#71896a" font-weight="400" text-anchor="end">通用桌面：定位浮层，不改原文布局</text><text x="1546" y="1011" font-size="9" fill="#91a486" font-weight="400" text-anchor="end">滚动 / 移动窗口后收起 · 模型与 OCR 均为示例</text></g></svg>