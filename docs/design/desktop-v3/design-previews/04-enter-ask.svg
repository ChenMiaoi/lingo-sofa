-linecap="round" stroke-linejoin="round"><use href="#rewrite"/></svg><text x="63" y="270" font-size="13" fill="#e4eee6" font-weight="400" >润色这段英文</text><text x="63" y="288" font-size="9" fill="#8da794" font-weight="400" >让表达更自然、更简洁</text><rect x="553" y="265" width="28" height="17" rx="3" fill="none" stroke="#435749"/><text x="559" y="277" font-size="8" fill="#7b9685" font-weight="400" >改写</text><rect x="1" y="332" width="638" height="31" rx="10" fill="#202622" /><path d="M0 332L640 332" stroke="#38423b" stroke-width="1" fill="none"/><text x="18" y="352" font-size="8" fill="#a4beac" font-weight="400" >↑↓ 选择      ↵ 执行      Esc 返回阅读</text><text x="622" y="352" font-size="8" fill="#a6c6b2" font-weight="400" text-anchor="end">Ask 模式 · 主动展开</text></g></g><text x="56" y="987" font-size="12" fill="#3d5e42" font-weight="500" >只有主动点击 Ask，才进入启动器模式。</text><text x="56" y="1011" font-size="10" fill="#7c9375" font-weight="400" >沿用已经选中的文字；Esc 返回阅读，恢复之前的轻量译文。</text><text x="1546" y="987" font-size="10" fill="#71896a" font-weight="400" text-anchor="end">通用桌面：定位浮层，不改原文布局</text><text x="1546" y="1011" font-size="9" fill="#91a486" font-weight="400" text-anchor="end">滚动 / 移动窗口后收起 · 模型与 OCR 均为示例</text></g></svg>