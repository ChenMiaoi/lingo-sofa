<symbol id="link" viewBox="0 0 24 24"><path d="m10 13 4-4m-7 8-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0-1 2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(3 0)"/></symbol>
<linearGradient id="wall" x2="1" y2="1"><stop stop-color="#e9ede3"/><stop offset="1" stop-color="#dce8d9"/></linearGradient></defs><g font-family="Inter,Segoe UI,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1500" height="900" rx="0" fill="#f5f6ef" /><text x="50" y="60" font-size="28" fill="#34543d" font-weight="500" >同样贴在原文下方，空间不足时也不假装重排。</text><g transform="translate(50 115)"><rect x="0" y="0" width="670" height="655" rx="8" fill="#fffefa" stroke="#dce6d5"/><text x="30" y="41" font-size="15" fill="#577a59" font-weight="500" >下方有空白：不遮挡阅读</text><path d="M30 61L640 61" stroke="#e1eadb" stroke-width="1" fill="none"/><rect x="30" y="99" width="318" height="20" rx="0" fill="#e0ecdf" /><rect x="30" y="123" width="373" height="20" rx="0" fill="#e0ecdf" /><rect x="30" y="147" width="296" height="20" rx="0" fill="#e0ecdf" /><text x="30" y="114" font-size="14" fill="#3e5144" font-weight="400" >Good design is as little design as possible.</text><text x="30" y="138" font-size="14" fill="#3e5144" font-weight="400" >It helps us focus on what matters, without getting</text><text x="30" y="162" font-size="14" fill="#3e5144" font-weight="400" >in the way of what we're trying to do.</text><text x="30" y="423" font-size="17" fill="#76896e" font-weight="400" font-family="Georgia,serif">Less friction. More flow.</text><text x="30" y="451" font-size="12" fill="#8b9c83" font-weight="400" >When technology meets us where we are, small moments of curiosity</text><text x="30" y="473" font-size="12" fill="#8b9c83" font-weight="400" >become opportunities to understand. We stay focused on the work</text><text x="30" y="495" font-size="12" fill="#8b9c83" font-weight="400" >in front of us, rather than the tools around it.</text><g transform="translate(30 181)"><g class="translation-overlay"><rect x="0" y="0" width="476" height="105" rx="3" fill="#fcfdf9" /><path d="M0 12L0 93" stroke="#9fcdb2" stroke-width="2" fill="none"/><text x="16" y="29" font-size="15" fill="#354c3e" font-weight="400" >好的设计，是尽可能少的设计。</text><text x="16" y="55" font-size="15" fill="#354c3e" font-weight="400" >它帮助我们专注于真正重要的事，</text><text x="16" y="81" font-size="15" fill="#354c3e" font-weight="400" >而不打扰我们正在做的事。</text><g class="translation-actions" style="opacity:0"><rect x="282" y="99" width="194" height="30" rx="5" fill="#fbfdf9" stroke="#dce8de"/><svg x="293" y="108" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#607e6a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#copy"/></svg><text x="313" y="119" font-size="10" fill="#5f7d69" font-weight="400" >复制</text><path d="M345 108L345 122" stroke="#dfe8df" stroke-width="1" fill="none"/><svg x="357" y="108" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#607e6a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#search"/></svg><text x="377" y="119" font-size="10" fill="#5f7d69" font-weight="400" >Ask</text><path d="M405 108L405 122" stroke="#dfe8df" stroke-width="1" fill="none"/><svg x="417" y="108" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#607e6a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#close"/></svg><text x="437" y="119" font-size="10" fill="#5f7d69" font-weight="400" >收起</text></g></g></g><text x="30" y="570" font-size="12" fill="#74936c" font-weight="400" >译文使用现有空白，原文位置保持不变。</text><text x="30" y="598" font-size="11" fill="#95a58a" font-weight="400" >这是通用桌面定位浮层，不是文档内插入。</text></g><g transform="translate(780 115)"><rect x="0" y="0" width="670" height="655" rx="8" fill="#fffefa" stroke="#dce6d5"/><text x="30" y="41" font-size="15" fill="#7b805d" font-weight="500" >下方拥挤：覆盖后文</text><path d="M30 61L640 61" stroke="#e1eadb" stroke-width="1" fill="none"/><rect x="30" y="99" width="318" height="20" rx="0" fill="#e0ecdf" /><rect x="30" y="123" width="373" height="20" rx="0" fill="#e0ecdf" /><rect x="30" y="147" width="296" height="20" rx="0" fill="#e0ecdf" /><text x="30" y="114" font-size="14" fill="#3e5144" font-weight="400" >Good design is as little design as possible.</text><text x="30" y="138" font-size="14" fill="#3e5144" font-weight="400" >It helps us focus on what matters, without getting</text><text x="30" y="162" font-size="14" fill="#3e5144" font-weight="400" >in the way of what we're trying to do.</text><text x="30" y="211" font-size="17" fill="#76896e" font-weight="400" font-family="Georgia,serif">Less friction. More flow.</text><text x="30" y="239" font-size="12" fill="#8b9c83" font-weight="400" >When technology meets us where we are, small moments of curiosity turn into real understanding.</text><text x="30" y="261" font-size="12" fill="#8b9c83" font-weight="400" >We stay focused on the work in front of us, rather than on the tools that surround it.</text><text x="30" y="283" font-size="12" fill="#8b9c83" font-weight="400" >A calmer interface leaves space for the next thought to arrive.</text><text x="30" y="305" font-size="12" fill="#8b9c83" font-weight="400" >Keep reading. The original paragraph has not moved.</text><g transform="translate(30 181)"><g class="translation-overlay"><rect x="0" y="0" width="476" height="105" rx="3" fill="#fcfdf9" /><path d="M0 12L0 93" stroke="#9fcdb2" stroke-width="2" fill="none"/><text x="16" y="29" font-size="15" fill="#354c3e" font-weight="400" >好的设计，是尽可能少的设计。</text><text x="16" y="55" font-size="15" fill="#354c3e" font-weight="400" >它帮助我们专注于真正重要的事，</text><text x="16" y="81" font-size="15" fill="#354c3e" font-weight="400" >而不打扰我们正在做的事。</text><g class="translation-actions" style="opacity:1"><rect x="282" y="99" width="194" height="30" rx="5" fill="#fbfdf9" stroke="#dce8de"/><svg x="293" y="108" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#607e6a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#copy"/></svg><text x="313" y="119" font-size="10" fill="#5f7d69" font-weight="400" >复制</text><path d="M345 108L345 122" stroke="#dfe8df" stroke-width="1" fill="none"/><svg x="357" y="108" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#607e6a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#search"/></svg><text x="377" y="119" font-size="10" fill="#5f7d69" font-weight="400" >Ask</text><path d="M405 108L405 122" stroke="#dfe8df" stroke-width="1" fill="none"/><svg x="417" y="108" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#607e6a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#close"/></svg><text x="437" y="119" font-size="10" fill="#5f7d69" font-weight="400" >收起</text></g></g></g><text x="30" y="570" font-size="12" fill="#7c815e" font-weight="400" >译文盖在原文之上，并没有把下一段向下推。</text><text x="30" y="598" font-size="11" fill="#95a58a" font-weight="400" >可收起后继续阅读；基线版本滚动后自动收起。</text></g><text x="50" y="833" font-size="13" fill="#678361" font-weight="400" >只有具备受支持的文档集成、能修改排版时，才可以做真正的行内重排。</text><text x="50" y="861" font-size="10" fill="#91a187" font-weight="400" >视觉概念预览 · 未读取屏幕，未连接模型。</text></g></svg>