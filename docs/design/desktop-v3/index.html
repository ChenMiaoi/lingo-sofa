\" y=\"179\" font-size=\"9\" fill=\"#7b9071\" font-weight=\"400\" >Saved</text><path d=\"M20 222L128 222\" stroke=\"#e3ebdb\" stroke-width=\"1\" fill=\"none\"/><text x=\"20\" y=\"246\" font-size=\"8\" fill=\"#91a087\" font-weight=\"400\" letter-spacing=\"1.1\">COLLECTIONS</text><text x=\"20\" y=\"273\" font-size=\"9\" fill=\"#91a087\" font-weight=\"400\" >Small ideas</text><text x=\"20\" y=\"300\" font-size=\"9\" fill=\"#91a087\" font-weight=\"400\" >For later</text><text x=\"198\" y=\"71\" font-size=\"8\" fill=\"#83967d\" font-weight=\"400\" letter-spacing=\"1.5\">READING / DESIGN NOTES</text><text x=\"198\" y=\"116\" font-size=\"28\" fill=\"#314338\" font-weight=\"400\" font-family=\"Georgia,serif\">Making room for what matters.</text><text x=\"198\" y=\"143\" font-size=\"9\" fill=\"#91a087\" font-weight=\"400\" >Emma Wilson   ·   6 min read   ·   October 20</text><text x=\"198\" y=\"190\" font-size=\"13\" fill=\"#6f806e\" font-weight=\"400\" >The best tools don't ask for your attention.</text><text x=\"198\" y=\"213\" font-size=\"13\" fill=\"#6f806e\" font-weight=\"400\" >They give it back.</text><rect x=\"198\" y=\"243\" width=\"318\" height=\"20\" rx=\"0\" fill=\"#e0ecdf\" /><rect x=\"198\" y=\"267\" width=\"373\" height=\"20\" rx=\"0\" fill=\"#e0ecdf\" /><rect x=\"198\" y=\"291\" width=\"296\" height=\"20\" rx=\"0\" fill=\"#e0ecdf\" /><text x=\"198\" y=\"258\" font-size=\"14\" fill=\"#3e5144\" font-weight=\"400\" >Good design is as little design as possible.</text><text x=\"198\" y=\"282\" font-size=\"14\" fill=\"#3e5144\" font-weight=\"400\" >It helps us focus on what matters, without getting</text><text x=\"198\" y=\"306\" font-size=\"14\" fill=\"#3e5144\" font-weight=\"400\" >in the way of what we're trying to do.</text><text x=\"198\" y=\"356\" font-size=\"18\" fill=\"#566b56\" font-weight=\"400\" font-family=\"Georgia,serif\">Less friction. More flow.</text><text x=\"198\" y=\"386\" font-size=\"12\" fill=\"#7f9178\" font-weight=\"400\" >When technology me
